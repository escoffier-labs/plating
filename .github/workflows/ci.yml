name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install svg-term-cli
        run: npm install -g svg-term-cli

      - name: Test
        run: |
          pip install -e . pytest tomli
          cat > /tmp/tomllib_shim.py <<'PY'
          import sys
          if sys.version_info < (3, 11):
              import tomli
              sys.modules["tomllib"] = tomli
          PY
          export PYTHONSTARTUP=/tmp/tomllib_shim.py
          pytest -q
